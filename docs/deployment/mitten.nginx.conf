# Example nginx configuration for one origin. Replace hostname, paths and certificate.
server {
    listen 80;
    server_name mitten.example;
    return 308 https://mitten.example$request_uri;
}

server {
    listen 443 ssl;
    server_name mitten.example;
    ssl_certificate /etc/ssl/mitten/fullchain.pem;
    ssl_certificate_key /etc/ssl/mitten/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/mitten/apps/web/dist;
    index index.html;
    client_max_body_size 32k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    proxy_read_timeout 75s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "serial=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; font-src 'self'; media-src 'self' blob:" always;

    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Forwarded "";

    location ~* ^/api/ready/?$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
