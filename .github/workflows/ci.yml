name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Audit production Node.js dependencies
        run: npm audit --omit=dev

      - name: Install firmware test dependency
        run: python -m pip install pytest

      - name: Test Node.js workspaces
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser journeys
        run: npm run test:e2e

      - name: Build Node.js workspaces
        run: npm run build

      - name: Test MicroPython-compatible firmware core
        run: python -B -m pytest firmware/esp32/tests -q -p no:cacheprovider

      - name: Upload verified application builds
        uses: actions/upload-artifact@v4
        with:
          name: mitten-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/api/dist/
            packages/contracts/dist/
