name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.17.0'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install firmware test dependency
        run: python -m pip install pytest

      - name: Test Node.js workspaces
        run: npm test

      - name: Build Node.js workspaces
        run: npm run build

      - name: Test MicroPython-compatible firmware core
        run: python -B -m pytest firmware/esp32/tests -q -p no:cacheprovider
