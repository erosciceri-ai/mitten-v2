name: Piper experiment

on:
  push:
    branches: [phase5a/production-prep]
    paths:
      - '.github/workflows/piper-experiment.yml'
      - 'tools/bench-render-free.mjs'
      - 'tools/piper-experiment/**'
  workflow_dispatch:
    inputs:
      timeout_ms:
        description: Diagnostic subprocess timeout in ms (pass criterion remains 60000)
        type: choice
        options: ['60000', '90000', '120000', '180000']
        default: '60000'

concurrency:
  group: piper-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tts:
    if: github.ref == 'refs/heads/phase5a/production-prep' && (github.event_name == 'workflow_dispatch' || vars.MITTEN_PIPER_EXPERIMENT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        voice: [es_AR-daniela-high, es_MX-ald-medium, es_MX-ald-x_low]
        threads: [default, one]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Measure API synthesis and isolated model reuse
        env:
          BENCH_TIMEOUT: ${{ inputs.timeout_ms || '60000' }}
        run: bash tools/piper-experiment/run.sh tts '${{ matrix.voice }}' '${{ matrix.threads }}' "$BENCH_TIMEOUT" "$RUNNER_TEMP/piper-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piper-${{ matrix.voice }}-${{ matrix.threads }}
          path: ${{ runner.temp }}/piper-results/
          retention-days: 7

  transport:
    if: github.ref == 'refs/heads/phase5a/production-prep' && (github.event_name == 'workflow_dispatch' || vars.MITTEN_PIPER_EXPERIMENT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify Range and ZIP with valid synthetic MP3
        run: bash tools/piper-experiment/run.sh transport es_AR-daniela-high default 60000 "$RUNNER_TEMP/piper-transport"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piper-transport
          path: ${{ runner.temp }}/piper-transport/
          retention-days: 7
